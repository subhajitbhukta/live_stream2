<!DOCTYPE html>
<html>
<head><title>Broadcaster</title>
<style>body{padding:30px;text-align:center;background:#f0f0f0;font-family:Arial}
video{width:100%;max-width:500px;border:4px solid #007bff;border-radius:15px;margin:20px 0}
button{padding:15px 30px;font-size:20px;margin:10px;border:none;border-radius:10px;cursor:pointer;color:white}
#start{background:#007bff} #record{background:#ff6b35} #stop{background:#dc3545} #upload{background:#28a745}
#status{font-size:24px;color:#28a745;margin:20px}
#recording{display:none;animation:blink 1s infinite}
@keyframes blink{50%{background:rgba(255,107,53,0.3)}}
</style></head>
<body>
<h1>📱 BROADCASTER</h1>
<div id="status">🔴 Click Start</div>
<video id="localVideo" autoplay muted playsinline></video><br>

<button id="start">▶️ START STREAM</button>
<button id="record" style="display:none">⏺️ START RECORDING</button>
<button id="stop" style="display:none">⏹️ STOP RECORDING</button>
<button id="upload" style="display:none">☁️ UPLOAD TO SERVER</button>
<div id="recording" class="blink">🔴 RECORDING...</div>
<div id="uploadStatus"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const video = document.getElementById('localVideo');
const status = document.getElementById('status');
const startBtn = document.getElementById('start');
const recordBtn = document.getElementById('record');
const stopBtn = document.getElementById('stop');
const uploadBtn = document.getElementById('upload');
const recordingDiv = document.getElementById('recording');
const uploadStatus = document.getElementById('uploadStatus');

let stream, canvas, ctx, mediaRecorder, recordedChunks = [], recordedBlob = null;

// START STREAMING
startBtn.onclick = async () => {
  try {
    status.textContent = '🟡 Getting camera...';
    stream = await navigator.mediaDevices.getUserMedia({video: {width: 640, height: 480}, audio: false});
    video.srcObject = stream;
    
    canvas = document.createElement('canvas');
    ctx = canvas.getContext('2d');
    
    status.textContent = '🟢 Streaming live!';
    startBtn.style.display = 'none';
    recordBtn.style.display = 'inline-block';
    socket.emit('start-broadcast');
    
    setInterval(() => {
      if (video.videoWidth > 0) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        const frameData = canvas.toDataURL('image/jpeg', 0.8);
        socket.emit('video-frame', frameData);
      }
    }, 66);
  } catch(err) {
    status.textContent = '❌ Error: ' + err.message;
  }
};

// START RECORDING
recordBtn.onclick = () => {
  if (!stream) {
    alert('Start streaming first!');
    return;
  }
  
  const canvasStream = canvas.captureStream(15);
  mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm; codecs=vp9' });
  
  recordedChunks = [];
  mediaRecorder.ondataavailable = (event) => {
    if (event.data.size > 0) recordedChunks.push(event.data);
  };
  
  mediaRecorder.onstop = () => {
    recordedBlob = new Blob(recordedChunks, { type: 'video/webm' });
    
    // Auto-download + show upload button
    const url = URL.createObjectURL(recordedBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `recording-${Date.now()}.webm`;
    a.click();
    
    uploadBtn.style.display = 'inline-block';
    status.textContent = '✅ Recording saved! Ready to upload';
  };
  
  mediaRecorder.start(100);
  recordBtn.style.display = 'none';
  stopBtn.style.display = 'inline-block';
  recordingDiv.style.display = 'block';
  status.textContent = '🔴 Recording + Streaming...';
};

// STOP RECORDING
stopBtn.onclick = () => {
  mediaRecorder.stop();
  recordBtn.style.display = 'inline-block';
  stopBtn.style.display = 'none';
  recordingDiv.style.display = 'none';
};

// UPLOAD TO SERVER
uploadBtn.onclick = async () => {
  if (!recordedBlob) {
    alert('No recording to upload!');
    return;
  }
  
  uploadStatus.textContent = '☁️ Uploading...';
  uploadBtn.disabled = true;
  
  const formData = new FormData();
  formData.append('video', recordedBlob, `recording-${Date.now()}.webm`);
  
  try {
    const response = await fetch('/upload-recording', {
      method: 'POST',
      body: formData
    });
    
    const result = await response.json();
    if (result.success) {
      uploadStatus.innerHTML = `✅ Uploaded! <a href="${result.url}" target="_blank">Watch</a>`;
      status.textContent = '🟢 All done!';
    } else {
      uploadStatus.textContent = '❌ Upload failed';
    }
  } catch(err) {
    uploadStatus.textContent = '❌ Network error';
  }
  
  uploadBtn.disabled = false;
  uploadBtn.style.display = 'none';
};
</script>
</body>
</html>
